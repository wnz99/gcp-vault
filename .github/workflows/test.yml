name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Run tests
        run: bash tests/gcp-vault-test.sh
      - name: Run ShellCheck
        run: shellcheck gcp-vault tests/gcp-vault-test.sh
